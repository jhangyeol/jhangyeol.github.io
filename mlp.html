<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="An interactive MLP with up to three hidden layers, MNIST and synthetic datasets, and a live loss landscape." />
    <title>2 layer MLP with simple data</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f5f1;
        --ink: #252b3b;
        --muted: #697283;
        --line: #e1e2e9;
        --purple: #7454d4;
        --orange: #de7841;
        --teal: #269a92;
        --soft: #f0ecfa;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font:
          14px/1.6 Inter,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          "Noto Sans KR",
          sans-serif;
      }
      button,
      input,
      select {
        font: inherit;
      }
      button,
      select {
        cursor: pointer;
      }
      button {
        padding: 8px 13px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: white;
        color: var(--ink);
        font-weight: 600;
      }
      button:hover {
        background: var(--soft);
        border-color: #bca9e8;
      }
      button:disabled {
        opacity: 0.45;
        cursor: default;
      }
      button.primary {
        background: var(--purple);
        border-color: var(--purple);
        color: white;
        min-width: 125px;
      }
      :focus-visible {
        outline: 3px solid #b099ea;
        outline-offset: 3px;
      }
      select,
      input[type="number"] {
        width: 100%;
        min-width: 0;
        padding: 6px 9px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: #fafafa;
        color: var(--ink);
        font-size: 12px;
      }
      input[type="range"] {
        width: 100%;
        accent-color: var(--purple);
        cursor: pointer;
      }
      .shell {
        max-width: 1280px;
        margin: auto;
        padding: 0 32px;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        padding: 32px 0 27px;
      }
      h1 {
        font-size: clamp(23px, 3vw, 34px);
        letter-spacing: -1px;
        line-height: 1.25;
        margin: 0;
        font-weight: 720;
      }
      #experiments {
        display: flex;
        flex-direction: column;
        gap: 28px;
        padding-bottom: 40px;
      }
      .experiment {
        border: 1px solid var(--line);
        border-radius: 15px;
        background: #fff;
        overflow: hidden;
        min-width: 0;
      }
      .panel-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 19px 23px;
        border-bottom: 1px solid var(--line);
      }
      .panel-title {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
      }
      h2 {
        font-size: 17px;
        margin: 0;
        letter-spacing: -0.3px;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 32px;
        height: 32px;
        flex-shrink: 0;
        border-radius: 8px;
        background: var(--soft);
        color: var(--purple);
        font:
          12px ui-monospace,
          monospace;
      }
      .width-label {
        color: var(--purple);
        font:
          12px ui-monospace,
          monospace;
      }
      .status {
        color: var(--teal);
        background: #e8f4ef;
        padding: 4px 10px;
        border-radius: 20px;
        font-size: 11px;
        white-space: nowrap;
      }
      .settings {
        padding: 16px 23px;
      }
      .dataset-row {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .dataset-caption {
        font-size: 11px;
        color: var(--muted);
      }
      .dataset-tabs {
        display: flex;
        gap: 7px;
        flex-wrap: wrap;
      }
      .dataset-tab {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        min-width: 86px;
        padding: 6px 16px;
        font-size: 12px;
        font-weight: 550;
      }
      .dataset-tab svg {
        display: block;
        width: 56px;
        height: 32px;
        flex-shrink: 0;
      }
      .dataset-tab[aria-pressed="true"] {
        background: var(--soft);
        border-color: var(--purple);
        color: var(--purple);
      }
      .control-grid {
        display: grid;
        grid-template-columns: repeat(6, minmax(0, 1fr));
        gap: 16px;
        margin-top: 13px;
      }
      .control {
        display: flex;
        flex-direction: column;
        gap: 4px;
        color: var(--muted);
        font-size: 10px;
      }
      .control-top {
        display: flex;
        justify-content: space-between;
        gap: 4px;
      }
      .plots {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 230px minmax(0, 1fr);
        border-top: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
      }
      .plot-pane {
        padding: 14px 15px 9px;
        background: #fafbfc;
        min-width: 0;
      }
      .latent-pane {
        background: linear-gradient(150deg, #fcfbfe, #f4f3fa);
      }
      .plot-heading {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        min-height: 30px;
      }
      .plot-heading strong {
        font-size: 12px;
      }
      .tag {
        font:
          10px ui-monospace,
          monospace;
        color: var(--muted);
      }
      .mini-button {
        font-size: 10px;
        padding: 3px 7px;
        font-weight: 500;
      }
      .plot-tools {
        display: flex;
        gap: 5px;
        align-items: center;
      }
      .axes {
        display: flex;
        gap: 4px;
      }
      .axes select {
        width: 46px;
        padding: 3px;
        font:
          10px ui-monospace,
          monospace;
        background: white;
      }
      canvas.scatter {
        display: block;
        width: 100%;
        height: 260px;
        touch-action: none;
        cursor: grab;
        border-radius: 8px;
      }
      canvas.scatter:active {
        cursor: grabbing;
      }
      .plot-foot {
        display: flex;
        justify-content: space-between;
        gap: 5px;
        flex-wrap: wrap;
        color: var(--muted);
        font-size: 9px;
      }
      .legend {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        margin-right: 4px;
      }
      .interaction-hint {
        margin: 7px 0 0;
        color: var(--muted);
        font-size: 9px;
      }
      .network-pane {
        border-left: 1px solid var(--line);
        border-right: 1px solid var(--line);
        padding: 15px 13px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        min-width: 0;
      }
      .network-shape {
        text-align: center;
        font:
          12px ui-monospace,
          monospace;
        color: var(--purple);
      }
      .network {
        width: 100%;
        height: 110px;
        display: block;
      }
      .formula {
        text-align: center;
        font:
          11px ui-monospace,
          monospace;
        color: var(--muted);
        margin: 2px 0 13px;
      }
      .weight-key {
        text-align: center;
        font-size: 9px;
        color: var(--muted);
        margin: 0 0 12px;
      }
      .metrics {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 7px;
        padding-top: 10px;
        border-top: 1px solid var(--line);
      }
      .metric-label {
        color: var(--muted);
        font-size: 9px;
      }
      .metric-value {
        font:
          600 20px/1.7 ui-monospace,
          monospace;
        letter-spacing: -1px;
      }
      .metric-sub {
        font-size: 9px;
        color: var(--muted);
      }
      .panel-bottom {
        padding: 15px 23px 17px;
      }
      .transport {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }
      .transport button {
        font-size: 12px;
      }
      .speed {
        display: flex;
        align-items: center;
        gap: 5px;
        color: var(--muted);
        font-size: 11px;
      }
      .speed select {
        width: 60px;
      }
      .step-counter {
        margin-left: auto;
        font:
          11px ui-monospace,
          monospace;
        white-space: nowrap;
      }
      .replay-row {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto;
        gap: 12px;
        align-items: center;
        margin: 12px 0 6px;
      }
      .replay-row label {
        font-size: 10px;
        color: var(--muted);
      }
      .replay-row input {
        min-width: 0;
        margin: 0;
      }
      .history-area {
        display: grid;
        grid-template-columns: 1fr 190px;
        align-items: center;
        gap: 22px;
      }
      .loss {
        display: block;
        width: 100%;
        height: 68px;
      }
      .history-note {
        font-size: 10px;
        color: var(--muted);
        line-height: 1.6;
      }
      .loss-key {
        display: flex;
        gap: 12px;
        color: var(--muted);
        font-size: 9px;
      }
      .loss-key span::before {
        content: "";
        display: inline-block;
        width: 14px;
        margin: 0 4px 3px 0;
        border-top: 2px solid var(--purple);
      }
      .loss-key span:nth-child(2)::before {
        border-top: 2px dashed var(--orange);
      }
      .export {
        margin-top: 8px;
      }
      .error {
        font-size: 12px;
        color: #ab3e32;
        margin: 8px 0 0;
      }
      .error:empty {
        display: none;
      }
      #tooltip {
        position: fixed;
        z-index: 20;
        pointer-events: none;
        background: #262b3d;
        color: white;
        padding: 8px 11px;
        border-radius: 7px;
        font:
          11px/1.6 ui-monospace,
          monospace;
        box-shadow: 0 5px 20px #0002;
        max-width: 260px;
        white-space: pre-line;
      }
      noscript {
        display: block;
        padding: 24px;
        background: #ffe4cb;
      }
      @media (max-width: 950px) {
        .shell {
          padding: 0 20px;
        }
        .plots {
          grid-template-columns: minmax(0, 1fr) 180px minmax(0, 1fr);
        }
        .plot-heading {
          align-items: flex-start;
          flex-wrap: wrap;
        }
        .plot-tools {
          flex-wrap: wrap;
        }
        .metric-value {
          font-size: 17px;
        }
        .control-grid {
          gap: 10px;
        }
        .network-pane {
          padding: 12px 8px;
        }
        .panel-title {
          gap: 8px;
        }
        h2 {
          font-size: 15px;
        }
        .width-label {
          font-size: 11px;
        }
        canvas.scatter {
          height: 235px;
        }
      }
      @media (max-width: 700px) {
        .shell {
          padding: 0 12px;
        }
        header {
          padding: 25px 2px 20px;
          gap: 12px;
        }
        h1 {
          font-size: 23px;
          max-width: 250px;
        }
        .panel-head {
          padding: 15px;
        }
        .panel-title {
          align-items: flex-start;
        }
        .width-label {
          display: block;
          margin-top: 3px;
        }
        .settings {
          padding: 14px;
        }
        .dataset-row {
          display: block;
        }
        .dataset-caption {
          display: block;
          margin-bottom: 5px;
        }
        .dataset-tabs {
          display: grid;
          grid-template-columns: repeat(4, minmax(0, 1fr));
          gap: 5px;
        }
        .dataset-tab {
          min-width: 0;
          padding: 6px 3px;
          font-size: 11px;
        }
        .control-grid {
          grid-template-columns: repeat(3, minmax(0, 1fr));
          gap: 10px;
        }
        .plots {
          grid-template-columns: 1fr 1fr;
        }
        .input-pane {
          order: 1;
        }
        .latent-pane {
          order: 2;
        }
        .network-pane {
          order: 3;
          grid-column: 1/-1;
          border-left: 0;
          border-right: 0;
          border-top: 1px solid var(--line);
          display: grid;
          grid-template-columns: 1fr 1fr;
          gap: 6px;
          padding: 12px 15px;
        }
        .network-info {
          min-width: 0;
        }
        .metrics {
          align-content: center;
          border-top: 0;
          border-left: 1px solid var(--line);
          padding: 0 0 0 13px;
        }
        .network {
          height: 80px;
        }
        .formula {
          margin: 0;
        }
        .weight-key {
          margin: 5px 0 0;
          font-size: 8px;
        }
        .plot-pane {
          padding: 10px 8px;
        }
        .plot-heading {
          min-height: 55px;
          align-content: flex-start;
          gap: 3px;
        }
        .plot-heading strong {
          font-size: 11px;
        }
        .axes select {
          width: 36px;
          font-size: 9px;
        }
        .mini-button {
          font-size: 9px;
          padding: 3px 5px;
        }
        canvas.scatter {
          height: 190px;
        }
        .plot-foot {
          font-size: 8px;
        }
        .interaction-hint {
          font-size: 8px;
        }
        .panel-bottom {
          padding: 12px 14px;
        }
        .transport {
          gap: 6px;
        }
        .transport button {
          font-size: 11px;
          padding: 7px 9px;
        }
        button.primary {
          min-width: 100px;
        }
        .speed {
          margin-left: auto;
        }
        .step-counter {
          width: 100%;
          margin: 2px 0 0;
          text-align: right;
        }
        .history-area {
          grid-template-columns: 1fr;
        }
        .history-note {
          display: flex;
          align-items: center;
          justify-content: space-between;
          gap: 10px;
          font-size: 9px;
        }
        .export {
          margin: 0;
        }
        #experiments {
          gap: 20px;
        }
        .replay-row {
          gap: 7px;
        }
        .replay-row label {
          font-size: 9px;
        }
      }
      @media (max-width: 370px) {
        .plots {
          grid-template-columns: 1fr;
        }
        .input-pane,
        .latent-pane,
        .network-pane {
          grid-column: 1;
        }
        .plot-heading {
          min-height: 28px;
          align-items: center;
        }
        canvas.scatter {
          height: 235px;
        }
        .panel-head {
          padding: 12px;
        }
        .status {
          font-size: 9px;
        }
      }
      /* Single experiment, graphic controls, and a larger editable network. */
      .shell {
        max-width: 1480px;
      }
      .panel-title h2 {
        font-size: 16px;
      }
      .badge {
        display: none;
      }
      .settings {
        padding: 20px 23px;
      }
      .dataset-row {
        display: block;
      }
      .dataset-caption {
        display: block;
        margin-bottom: 8px;
        font-weight: 650;
      }
      .dataset-tabs {
        display: grid;
        grid-template-columns: repeat(8, minmax(0, 1fr));
        gap: 8px;
      }
      .dataset-tab {
        min-width: 0;
        padding: 9px 5px;
      }
      .dataset-tab svg {
        width: 65px;
        height: 39px;
      }
      .data-note {
        margin: 8px 0 0;
        color: var(--muted);
        font-size: 11px;
        min-height: 18px;
      }
      .model-controls {
        display: grid;
        grid-template-columns: 1fr 1.15fr 1fr;
        gap: 18px;
        padding-top: 17px;
        margin-top: 14px;
        border-top: 1px solid var(--line);
      }
      .choice-label {
        display: block;
        font-size: 11px;
        color: var(--muted);
        font-weight: 650;
        margin-bottom: 7px;
      }
      .choice-group {
        display: flex;
        gap: 7px;
      }
      .graphic-button {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 5px;
        flex: 1;
        min-width: 0;
        padding: 9px 7px;
        font-size: 11px;
      }
      .graphic-button svg {
        width: 60px;
        height: 32px;
        display: block;
      }
      .graphic-button[aria-pressed="true"],
      .width-button[aria-pressed="true"] {
        background: var(--soft);
        border-color: var(--purple);
        color: var(--purple);
      }
      .activation-controls {
        grid-column: 1/3;
      }
      .activation-controls .choice-group {
        display: grid;
        grid-template-columns: repeat(6, minmax(0, 1fr));
      }
      .activation-controls .graphic-button svg {
        width: 68px;
        height: 35px;
      }
      .width-controls .choice-group {
        margin-bottom: 8px;
      }
      .width-button {
        flex: 1;
        white-space: nowrap;
        font:
          12px ui-monospace,
          monospace;
        padding: 8px 5px;
      }
      .width-manual {
        display: flex;
        gap: 8px;
        align-items: center;
        font-size: 11px;
        color: var(--muted);
      }
      .width-manual input {
        width: 66px;
        text-align: center;
      }
      .width-manual input[type="range"] {
        flex: 1;
        min-width: 30px;
      }
      .settings-note {
        font-size: 10px;
        color: var(--muted);
        margin: 12px 0 0;
      }
      .control-grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
        max-width: none;
        margin-top: 17px;
      }
      .plots {
        grid-template-columns: minmax(0, 1fr) 360px minmax(0, 1fr);
      }
      .network-pane {
        padding: 13px 12px;
      }
      .network {
        height: 300px;
      }
      .network-info {
        min-width: 0;
      }
      .network circle.neuron {
        transition:
          fill 0.12s,
          stroke-width 0.12s;
      }
      .network .editable {
        cursor: pointer;
      }
      .network .editable:hover circle {
        fill: #e0d4ff;
        stroke-width: 3;
      }
      .network .editable:focus-visible {
        outline: none;
      }
      .network .editable:focus-visible circle {
        stroke: #252b3b;
        stroke-width: 3;
      }
      .network text {
        pointer-events: none;
      }
      .network .add-node circle {
        stroke-dasharray: 4 3;
      }
      .network-help {
        font-size: 10px;
        text-align: center;
        color: var(--muted);
        margin: 5px 0 10px;
      }
      .network-shape {
        font-size: 11px;
      }
      .formula {
        margin-bottom: 8px;
      }
      .weight-key {
        margin-bottom: 7px;
      }
      .metrics {
        padding: 10px 8px 0;
      }
      .metric-label {
        font-size: 10px;
      }
      .metric-value {
        font-size: 23px;
      }
      .plot-pane {
        display: flex;
        flex-direction: column;
      }
      .scatter {
        flex: 1;
        min-height: 340px;
      }
      .plot-heading {
        flex-wrap: wrap;
      }
      .plot-foot {
        margin-top: auto;
      }
      .history-area {
        grid-template-columns: 1fr 240px;
      }
      .loss {
        height: 80px;
      }
      .landscape-section {
        border-top: 1px solid var(--line);
        padding: 23px;
        background: #fcfcfe;
      }
      .landscape-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
      }
      .landscape-heading h3 {
        font-size: 17px;
        margin: 0;
      }
      .landscape-heading .tag {
        font-size: 11px;
      }
      .landscape-layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 290px;
        gap: 23px;
        margin-top: 16px;
      }
      .landscape-view {
        min-width: 0;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: #f8f7fc;
        overflow: hidden;
      }
      .landscape-canvas {
        width: 100%;
        height: 400px;
        display: block;
        touch-action: none;
      }
      .landscape-modes {
        display: flex;
        gap: 6px;
      }
      .landscape-modes[hidden] {
        display: none;
      }
      .landscape-modes button[aria-pressed="true"] {
        background: #ede8ff;
        color: #7048d6;
        border-color: #9574ed;
      }
      .landscape-controls {
        display: flex;
        flex-direction: column;
        gap: 11px;
        min-width: 0;
      }
      .landscape-controls label {
        font-size: 11px;
        color: var(--muted);
      }
      .landscape-controls select {
        margin-top: 4px;
        font:
          11px ui-monospace,
          monospace;
      }
      .landscape-summary {
        border: 1px solid var(--line);
        border-radius: 9px;
        padding: 12px;
        background: white;
      }
      .landscape-summary strong {
        display: block;
        font:
          600 23px ui-monospace,
          monospace;
        margin-top: 4px;
        color: var(--ink);
      }
      .landscape-summary span {
        font-size: 10px;
        color: var(--muted);
      }
      .landscape-note {
        font-size: 11px;
        color: var(--muted);
        line-height: 1.8;
        margin: 0;
      }
      .landscape-legend {
        display: flex;
        gap: 12px;
        font-size: 10px;
        color: var(--muted);
        margin-top: 7px;
      }
      .landscape-legend span::before {
        content: "";
        display: inline-block;
        width: 8px;
        height: 8px;
        background: #fff;
        border: 2px solid #263348;
        border-radius: 50%;

    <main class="shell">
      <header>
        <h1>2 layer MLP with simple data</h1>

    <div id="tooltip" hidden></div>
    <script id="mlp-core">
      // Dependency-free numerical core. All randomness is explicit and reproducible.
      const MLPCore = (() => {
        function rng(seed) {
          let a = seed >>> 0;

            a += 0x6d2b79f5;
            let t = a;

          n = Math.max(20, Math.min(300, Math.floor(n / 10) * 10));
          const random = rng(seed),
            perClass = n / 10,
            groups = Array.from({ length: 10 }, (_, label) =>
              shuffle(
                Array.from({ length: 100 }, (_, i) => label * 100 + i),
                random
              ).slice(0, perClass)
            );
          const points = [];
          for (let i = 0; i < n; i++) {
            const label = i % 10,
              imageIndex = groups[label][Math.floor(i / 10)],
              offset = imageIndex * 784,
              x = Array.from(mnistCorpus.pixels.subarray(offset, offset + 784), (v) => v / 255);
            points.push({
              id: i,
              label,
              x,
              raw: Array.from(mnistCorpus.pixels.subarray(offset, offset + 784)),
              train: Math.floor(i / 10) < Math.floor(perClass * 0.8),
              imageIndex,
              sourceIndex: mnistCorpus.indices[imageIndex],
              view: mnistCorpus.coordinates[imageIndex],
            });
          }
          return {
            points,
            train: points.filter((p) => p.train),
            validation: points.filter((p) => !p.train),
            d: 784,
            k: 10,
            mean: Array(784).fill(0),
            scale: Array(784).fill(255),
            normalization: "Pixel values divided by 255; no PCA features used for training.",
            projection: "PCA on the embedded 1000-image pool, for visualization only.",
          };
        }
        function dataset(kind, d, n, noise, seed) {
          if (kind === "mnist") return mnistDataset(n, seed);
          if (["hopf", "swiss", "scurve"].includes(kind)) d = 3;
          const random = rng(seed),
            k = kind === "clusters" ? 3 : 2,
            points = [];
          for (let i = 0; i < n; i++) {
            const label = i % k,
              t = random() * 2 * Math.PI;
            let x;
            if (kind === "clusters") {
              const a = (label * 2 * Math.PI) / 3;
              x = [1.25 * Math.cos(a), 1.25 * Math.sin(a), [-0.7, 0.7, 0][label]];
            } else if (kind === "circles") {
              const r = label === 0 ? 1.25 : 0.55;
              x = [r * Math.cos(t), r * Math.sin(t), label === 0 ? -0.35 : 0.35];
            } else if (kind === "spiral") {
              const u = 0.05 + 0.95 * random(),

              const angle = random() * Math.PI;

            } else if (kind === "xor") {
              const sign = random() < 0.5 ? -1 : 1;
              x = [sign, label === 0 ? sign : -sign, normal(random) * 0.35];
            } else if (kind === "swiss") {
              const u = (label + random()) / 2,
                angle = 1.5 * Math.PI * (1 + 2 * u);

            } else if (kind === "scurve") {
              const u = (label + random()) / 2,
                angle = 3 * Math.PI * (u - 0.5);

            } else x = label === 0 ? [Math.cos(t), Math.sin(t), 0] : [1 + Math.cos(t), 0, Math.sin(t)];
            x = x.slice(0, d).map((v) => v + normal(random) * (noise + (kind === "clusters" ? 0.12 : kind === "xor" ? 0.16 : 0)));
            points.push({ id: i, x, label, train: true });
          }
          // Stratification preserves every class in both splits, even on small datasets.
          for (let c = 0; c < k; c++) {
            const group = shuffle(
              points.filter((p) => p.label === c),
              random
            );
            group.slice(Math.floor(group.length * 0.8)).forEach((p) => (p.train = false));
          }
          const train = points.filter((p) => p.train),
            mean = Array(d).fill(0),
            scale = Array(d).fill(0);
          train.forEach((p) => p.x.forEach((v, j) => (mean[j] += v / train.length)));
          train.forEach((p) => p.x.forEach((v, j) => (scale[j] += (v - mean[j]) ** 2 / train.length)));
          for (let j = 0; j < d; j++) scale[j] = Math.sqrt(scale[j]) || 1;

        function gelu(x) {

        }
        function geluDerivative(x) {
          const c = Math.sqrt(2 / Math.PI),
            u = Math.tanh(c * (x + 0.044715 * x ** 3));

        }
        function activate(x, kind) {
          if (kind === "tanh") return Math.tanh(x);
          if (kind === "relu") return Math.max(0, x);
          if (kind === "gelu") return gelu(x);
          if (kind === "leaky") return x >= 0 ? x : 0.1 * x;
          if (kind === "sigmoid") {
            const exp = Math.exp(-Math.abs(x));

        }

          if (kind === "gelu") return geluDerivative(x);
          if (kind === "leaky") return x >= 0 ? 1 : 0.1;
          if (kind === "sigmoid") return z * (1 - z);

        }
        class Model {
          constructor(d, h, k, objective, activation, seed, extraHidden = [], optimizerBuffers = true) {
            Object.assign(this, { d, h, k, objective, activation, t: 0 });
            this.o = objective === "reconstruction" ? d : k;
            this.hiddenSizes = [h, ...extraHidden];
            this.sizes = [d, ...this.hiddenSizes, this.o];
            const random = rng(seed);
            this.params = [];
            for (let layer = 0; layer < this.sizes.length - 1; layer++) {

                output = this.sizes[layer + 1],
                scale = Math.sqrt(6 / (input + output));
              this.params.push(
                Float64Array.from({ length: input * output }, () => (random() * 2 - 1) * scale),
                new Float64Array(output)
              );
            }
            this.w1 = this.params[0];
            this.b1 = this.params[1];
            this.w2 = this.params.at(-2);
            this.b2 = this.params.at(-1);
            this.m = optimizerBuffers ? this.params.map((p) => new Float64Array(p.length)) : null;
            this.v = optimizerBuffers ? this.params.map((p) => new Float64Array(p.length)) : null;
          }
          forward(x) {
            const activations = [x],
              preLayers = [];
            let input = x;
            for (let layer = 0; layer < this.sizes.length - 1; layer++) {
              const width = this.sizes[layer + 1],
                pre = this.params[layer * 2 + 1].slice(),
                weights = this.params[layer * 2];
              for (let i = 0; i < input.length; i++) {
                const value = input[i];
                if (value === 0) continue;
                const offset = i * width;
                for (let j = 0; j < width; j++) pre[j] += value * weights[offset + j];
              }
              preLayers.push(pre);
              if (layer < this.hiddenSizes.length) {
                input = Float64Array.from(pre, (v) => activate(v, this.activation));
                activations.push(input);
              } else input = pre;
            }
            const logits = input,
              y = logits.slice();
            if (this.objective === "classification") {
              const max = Math.max(...y);
              let sum = 0;
              for (let i = 0; i < y.length; i++) {
                y[i] = Math.exp(y[i] - max);
                sum += y[i];
              }
              for (let i = 0; i < y.length; i++) y[i] /= sum;

          loss(point, result = this.forward(point.x)) {

          }

            const gradients = this.params.map((p) => new Float64Array(p.length));

                result.y,
                (value, j) =>

                  const offset = i * width;
                  for (let j = 0; j < width; j++) gw[offset + j] += value * delta[j];

          trainStep(batch, lr, optimizer = "adam") {
            const gradients = this.gradients(batch);

              this.params.forEach((p, l) => {

              const h = e.model.h + delta;

            } else {
              const extra = [...e.config.extraHidden],
                h = extra[layer - 1] + delta;
              if (h >= 1 && h <= (e.config.kind === "mnist" ? 128 : 32)) {
                extra[layer - 1] = h;
                this.reset({ ...e.config, extraHidden: extra });
              }
            }
          }
          q(selector) {
            return this.root.querySelector(selector);
          }
          control(name) {
            return this.q(`[data-control="${name}"]`);
          }
          syncControls() {
            const e = this.experiment,
              mnist = e.config.kind === "mnist";
            this.control("n").innerHTML = (mnist ? [100, 200, 300] : [240, 480, 900]).map((n) => `<option>${n}</option>`).join("");
            for (const [key, value] of Object.entries(e.config)) {
              const control = this.control(key);
              if (control && key !== "h") control.value = value;
            }
            this.control("h").max = e.maxHidden;
            this.control("h").value = e.model.h;
            this.q("[data-width-slider]").max = e.maxHidden;
            this.q("[data-width-slider]").value = e.model.h;
            this.control("noise").disabled = mnist;
            this.control("stepLimit").max = mnist ? 1000 : 10000;
            this.q(".noise-value").value = e.config.noise.toFixed(2);
            this.root
              .querySelectorAll("[data-dataset]")
              .forEach((button) => button.setAttribute("aria-pressed", String(button.dataset.dataset === e.config.kind)));
            this.root.querySelectorAll("[data-choice]").forEach((button) => {
              const field = button.dataset.choice,
                value = field === "d" && mnist ? e.config.viewD || 2 : e.config[field];
              button.setAttribute("aria-pressed", String(String(value) === button.dataset.value));
              button.disabled = field === "d" && button.dataset.value === "2" && threeDimensional(e.config.kind);
            });
            this.root
              .querySelectorAll("[data-width]")
              .forEach((button) => button.setAttribute("aria-pressed", String(e.model.h === e.data.d + Number(button.dataset.width) - 1)));
            this.q(".extra-layers").innerHTML = e.config.extraHidden
              .map(
                (n, i) =>
                  `<label>H${i + 2}<input type="number" data-extra="${i}" min="1" max="${mnist ? 128 : 32}" step="1" value="${n}" aria-label="H${
                    i + 2
                  }"/></label>`
              )
              .join("");
            this.q('[data-action="add-layer"]').disabled = e.config.extraHidden.length >= 2;
            this.q('[data-action="remove-layer"]').disabled = !e.config.extraHidden.length;
            this.q(".latent-layer").innerHTML = e.model.hiddenSizes.map((n, i) => `<option value="${i}">H${i + 1} (${n})</option>`).join("");
            this.q(".latent-layer").value = this.latentLayer;
            this.q(".latent-layer").hidden = e.model.hiddenSizes.length === 1;
            this.renderAxes();
          }
          renderAxes() {
            const h = this.experiment.model.hiddenSizes[this.latentLayer];
            if (this.experiment.config.kind === "mnist") {
              this.q(".axes").innerHTML =
                `<select data-pca aria-label="Hidden PCA dimensions"><option value="2">PCA · PC1, PC2</option><option value="3">PCA · PC1, PC2, PC3</option></select>`;
              this.q("[data-pca]").value = this.pcaDimensions || 2;
              return;
            }
            this.q(".axes").innerHTML = Array.from(
              { length: Math.min(h, 3) },
              (_, axis) =>
                `<select data-axis="${axis}" aria-label="${t("latent")} ${axis + 1}">${Array.from(
                  { length: h },
                  (_, j) => `<option value="${j}" ${j === this.latentView.axes[axis] ? "selected" : ""}>h${j + 1}</option>`
                ).join("")}</select>`
            ).join("");
          }
          reset(config = this.experiment.config) {
            this.remote?.destroy();
            this.remote = null;
            this.experiment.reset(config);
            this.latentLayer = this.experiment.model.hiddenSizes.length - 1;
            if (config.kind === "mnist") this.remote = new RemoteTrainer(this);
            this.landscape.reset();
            this.hoverId = -1;
            $("tooltip").hidden = true;
            this.inputView.axes = [0, 1, 2];
            this.latentView.axes = [0, 1, 2];
            this.inputView.reset();
            this.latentView.reset();
            this.syncControls();
            this.translate();
          }
          translate() {
            const e = this.experiment,
              m = e.model;
            this.root.querySelectorAll("[data-i18n]").forEach((el) => (el.textContent = t(el.dataset.i18n)));
            this.q("h2").textContent = `${t(e.objective)} · ${e.config.optimizer.toUpperCase()}`;
            this.q(".width-label").textContent = `d = ${m.d} · h = ${m.h} · ${m.sizes.join(" → ")}`;
            this.q(".input-tag").textContent = `${e.data.d}D · N = ${e.data.points.length}`;
            document.querySelector("h1").textContent = `${m.hiddenSizes.length + 1} layer MLP with simple data`;
            this.q(".dimension-controls .choice-label").textContent = t(e.config.kind === "mnist" ? "inputView" : "dimension");
            this.q(".model-limits").textContent = t(e.config.kind === "mnist" ? "mnistLimits" : "syntheticLimits");
            this.q(".mnist-source").hidden = e.config.kind !== "mnist";
            this.q("#replay-note-0").textContent = t(e.config.kind === "mnist" ? "mnistHistory" : "timelineNote");
            this.q(".latent-layer").setAttribute("aria-label", t("viewLayer"));
            const gallery = this.q(".digit-gallery");
            gallery.hidden = e.config.kind !== "mnist";
            gallery.replaceChildren();
            if (!gallery.hidden)
              for (const point of e.data.points.slice(0, 10)) {
                const tile = document.createElement("span");
                tile.append(digitCanvas(point, 24), document.createTextNode(String(point.label)));
                gallery.append(tile);
              }
            this.q(".legend").innerHTML = Array.from(
              { length: e.data.k },
              (_, i) =>
                `<span><i class="dot" style="background:${colors[i]}"></i>${e.config.kind === "mnist" ? i : String.fromCharCode(65 + i)}</span>`
            ).join("");
            this.q(".split-info").textContent = `${t("train")} ${e.data.train.length} / ${t("validation")} ${e.data.validation.length}`;
            this.q(".projection-note").textContent = t(
              e.config.kind === "mnist" ? "pcaNote" : m.hiddenSizes[this.latentLayer] > 3 ? "projection" : "coordinates"
            );
            this.q(".data-note").textContent = e.config.kind === "mnist" ? t("mnistNote") : copy[lang].dataNotes[e.config.kind];
            this.q('[data-choice="d"][data-value="2"]').title = threeDimensional(e.config.kind) ? t("threeDOnly") : "";
            this.q('[data-choice="activation"][data-value="gelu"]').title = t("geluHint");
            this.q("[data-width-slider]").setAttribute("aria-label", t("hiddenWidth"));
            this.q(".landscape-axis-a").setAttribute("aria-label", t("sliceX"));
            this.q(".landscape-axis-b").setAttribute("aria-label", t("sliceY"));
            this.q(".landscape-modes").hidden = e.config.kind === "mnist";
            this.q('[data-i18n="sliceNote"]').textContent = t(e.config.kind === "mnist" ? "postNote" : "sliceNote");
            this.landscape.dirty = true;
            this.renderAxes();
            for (const [selector, key] of [
              [".input-plot", "inputSpace"],
              [".latent-plot", "latent"],
            ])
              this.q(selector).setAttribute("aria-label", `${t(e.objective)} ${m.d} → ${m.h} · ${t(key)}. ${t("keyboard")}`);
            this.q(".loss").setAttribute("aria-label", `${t(e.objective)} · ${t("loss")}`);
            this.render();
          }
          render() {
            const e = this.experiment,
              s = e.history[e.shown].model,
              m = e.model;
            this.q(".timeline").max = e.history.length - 1;
            this.q(".timeline").value = e.shown;
            this.q(".step-counter").textContent = `STEP ${String(e.history[e.shown].step).padStart(4, "0")} / ${e.limit}`;
            this.q(".status").textContent = t(
              e.running
                ? "running"
                : e.replaying
                  ? "replaying"
                  : e.history[e.shown].step < e.step
                    ? "history"
                    : e.step >= e.limit
                      ? "complete"
                      : e.step
                        ? "paused"
                        : "ready"
            );
            const run = this.q('[data-action="run"]');
            run.textContent = t(e.running ? "pause" : e.step >= e.limit ? "complete" : e.step ? "resume" : "run");
            run.disabled = e.step >= e.limit || e.failed;
            this.q('[data-action="step"]').disabled = e.running || e.replaying || e.step >= e.limit || e.failed || this.remote?.busy;
            this.q('[data-action="replay"]').disabled = e.history.length < 2;
            this.q('[data-action="replay"]').textContent = t(e.replaying ? "stopReplay" : "replay");
            this.q(".error").textContent = e.failed ? t("failed") : "";
            this.q(".metrics").innerHTML =
              m.objective === "reconstruction"
                ? `<div><div class="metric-label">${t("trainMSE")}</div><div class="metric-value">${fmt(
                    s.train.loss
                  )}</div></div><div><div class="metric-label">${t("valMSE")}</div><div class="metric-value">${fmt(s.validation.loss)}</div></div>`
                : `<div><div class="metric-label">${t("valAcc")}</div><div class="metric-value">${(s.validation.accuracy * 100).toFixed(
                    1
                  )}%</div><div class="metric-sub">${t("error")} ${((1 - s.validation.accuracy) * 100).toFixed(
                    1
                  )}%</div></div><div><div class="metric-label">${t("valCE")}</div><div class="metric-value">${fmt(
                    s.validation.loss
                  )}</div><div class="metric-sub">${t("train")} ${(s.train.accuracy * 100).toFixed(1)}% · CE ${fmt(s.train.loss)}</div></div>`;
            if (e.config.kind === "mnist") {
              if (this.pcaSnapshot !== s || this.pcaLayer !== this.latentLayer) {
                this.pcaSnapshot = s;
                this.pcaLayer = this.latentLayer;
                this.latentView.fit();
              }
            } else if (m.activation !== "tanh") {
              let max = 0;
              for (const p of s.layerLatents[this.latentLayer]) for (const v of p) max = Math.max(max, Math.abs(v));
              this.latentView.bound = Math.max(this.latentView.bound, Math.ceil(max * 1.1));
            }
            this.network(s);
            this.landscape.request();
            this.dirty = true;
          }
          network(snapshot) {
            const m = this.experiment.model,
              ns = m.sizes,
              columns = ns.length,
              xs = ns.map((_, i) => 35 + (i * 330) / (columns - 1)),
              shown = ns.map((n, l) => {
                const cap = l === 0 ? 6 : l === ns.length - 1 ? 10 : 8;
                return Array.from({ length: Math.min(n, cap) }, (_, i) => Math.floor((i * n) / Math.min(n, cap)));
              }),
              pos = (l, index) => [xs[l], 42 + ((shown[l].indexOf(index) + 1) * 204) / (shown[l].length + 1)],
              refs = this.landscape?.refs || [],
              selected = [this.landscape?.axisA, this.landscape?.axisB].map((i) => refs[i]);
            let svg = "";
            for (let l = 0; l < columns - 1; l++)
              for (const a of shown[l])
                for (const b of shown[l + 1]) {
                  const index = a * ns[l + 1] + b,
                    w = snapshot.weights[2 * l][index],
                    p = pos(l, a),
                    q = pos(l + 1, b),
                    chosen = selected.some((ref) => ref?.group === l * 2 && ref.index === index);
                  svg += `<line x1="${p[0]}" y1="${p[1]}" x2="${q[0]}" y2="${q[1]}" stroke="${w >= 0 ? colors[0] : colors[1]}" stroke-opacity="${
                    chosen ? 0.85 : Math.min(0.7, 0.14 + Math.abs(w) * 0.25)
                  }" stroke-width="${chosen ? 3 : Math.min(3, 0.65 + Math.abs(w) * 0.8)}" ${chosen ? 'stroke-dasharray="5 3"' : ""}/>`;
                }
            ns.forEach((n, l) => {
              const hidden = l > 0 && l < columns - 1,
                layer = l - 1;
              for (const j of shown[l]) {
                const p = pos(l, j),
                  editable = hidden && n > 1,
                  r = columns > 3 ? 8 : 10;
                svg += `<g ${
                  editable
                    ? `class="editable" data-neuron="remove" data-layer="${layer}" role="button" tabindex="0" aria-label="${t(
                        "removeNeuron"
                      )} H${l}:${j + 1}"`
                    : ""
                }><circle class="neuron" cx="${p[0]}" cy="${p[1]}" r="${r}" fill="${hidden ? "#eae3fb" : "white"}" stroke="${
                  hidden ? colors[0] : "#8791a6"
                }" stroke-width="1.7"/><text x="${p[0]}" y="${p[1] + 3}" text-anchor="middle" fill="#645679" font-size="${j > 98 ? 6 : 8}">${
                  j + 1
                }</text></g>`;
              }
              svg += `<text x="${xs[l]}" y="282" text-anchor="middle" fill="#78808f" font-size="${columns > 3 ? 10 : 12}">${
                hidden ? "H" + l : t(l === 0 ? "inputLabel" : "outputLabel")
              } ${n}</text>`;
              if (n > shown[l].length) svg += `<text x="${xs[l]}" y="257" text-anchor="middle" fill="#78808f" font-size="10">⋮</text>`;
              const limit = layer === 0 ? this.experiment.maxHidden : this.experiment.config.kind === "mnist" ? 128 : 32;
              if (hidden && n < limit)
                svg += `<g class="editable add-node" data-neuron="add" data-layer="${layer}" role="button" tabindex="0" aria-label="${t(
                  "addNeuron"
                )} H${l}"><circle cx="${xs[l]}" cy="20" r="12" fill="white" stroke="${colors[0]}" stroke-width="1.5"/><text x="${
                  xs[l]
                }" y="25" text-anchor="middle" fill="${colors[0]}" font-size="20">+</text></g>`;
            });
            this.q(".network").innerHTML = svg;
            this.q(".network").setAttribute("aria-label", `${ns.join(" → ")}. ${t("networkHelp")}`);
            this.q(".network-shape").textContent = `${ns.join(" → ")} · ${m.params.reduce((sum, p) => sum + p.length, 0).toLocaleString()} ${t(
              "params"
            )}`;
            this.q(".formula").textContent = `H${this.latentLayer + 1}: ${m.activation}(W${this.latentLayer + 1}z + b${this.latentLayer + 1})`;
          }
          drawLoss() {
            const e = this.experiment,
              { ctx, w, h } = canvasSize(this.q(".loss")),
              past = e.config.kind === "mnist" ? e.history : e.history.slice(0, e.shown + 1),
              max = Math.max(0.0001, ...past.flatMap((s) => [s.model.train.loss, s.model.validation.loss])) * 1.08,
              end = Math.max(10, past.at(-1).step),
              left = 42,
              right = w - 8,
              top = 8,
              bottom = h - 15;
            ctx.font = "8px ui-monospace,monospace";
            ctx.fillStyle = "#9394a0";
            ctx.fillText(max.toFixed(2), 0, top + 4);
            ctx.fillText("0", 28, bottom + 2);
            ctx.fillText("0", left, bottom + 12);
            ctx.fillText(String(end), right - 22, bottom + 12);
            ctx.strokeStyle = "#edecf2";
            ctx.beginPath();
            ctx.moveTo(left, top);
            ctx.lineTo(left, bottom);
            ctx.lineTo(right, bottom);
            ctx.stroke();
            ["train", "validation"].forEach((split, j) => {
              ctx.strokeStyle = j ? colors[1] : colors[0];
              ctx.lineWidth = 1.7;
              ctx.setLineDash(j ? [4, 3] : []);
              ctx.beginPath();
              past.forEach((s, n) => {
                const x = left + ((right - left) * s.step) / end,
                  y = bottom - ((bottom - top) * s.model[split].loss) / max;
                if (n) ctx.lineTo(x, y);
                else ctx.moveTo(x, y);
              });
              ctx.stroke();
              ctx.setLineDash([]);
            });
          }
          export() {
            const e = this.experiment,
              m = e.model,
              out = {
                version: 3,
                panel: this.index + 1,
                config: e.config,
                objective: e.objective,
                width: m.hiddenSizes,
                optimizer:
                  e.config.optimizer === "adam"
                    ? { name: "Adam", beta1: 0.9, beta2: 0.999, epsilon: 1e-8, batch: e.config.kind === "mnist" ? 8 : 32 }
                    : { name: "SGD", momentum: 0, batch: e.config.kind === "mnist" ? 8 : 32 },
                landscape: {
                  axisA: this.landscape.refs[this.landscape.axisA],
                  axisB: this.landscape.refs[this.landscape.axisB],
                  subsetIds: this.landscape.points.map((p) => p.id),
                  bounds: this.landscape.bounds,
                },
                normalization: { mean: e.data.mean, scale: e.data.scale },
                data: e.data.points,
                viewedStep: e.history[e.shown].step,
                latestStep: e.step,
                model: {
                  d: m.d,
                  h: m.h,
                  hiddenSizes: m.hiddenSizes,
                  o: m.o,
                  objective: m.objective,
                  activation: m.activation,
                  weights: e.history.at(-1).model.weights,
                },
                viewedLatents: e.history[e.shown].model.layerLatents[this.latentLayer],
                viewedLayer: this.latentLayer,
                viewedPCA:
                  e.config.kind === "mnist" ? { ...e.history[e.shown].model.layerPCA[this.latentLayer], dimensions: this.pcaDimensions || 2 } : null,
                history: e.history.map((s) => ({
                  step: s.step,
                  model: { train: s.model.train, validation: s.model.validation, weights: s.model.weights },
                })),
              };
            const url = URL.createObjectURL(new Blob([JSON.stringify(out)], { type: "application/json" })),
              a = document.createElement("a");
            a.href = url;
            a.download = `mlp-panel-${this.index + 1}-${e.config.kind}-step${e.step}.json`;
            a.click();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
          }
          draw() {
            this.inputView.draw();
            this.latentView.draw();
            this.drawLoss();
            this.dirty = false;
          }
        }
        const panels = [new Panel()];
        $("language").addEventListener("click", () => {
          lang = lang === "en" ? "ko" : "en";
          document.documentElement.lang = lang;
          $("language").textContent = lang === "en" ? "한국어" : "English";
          $("language").setAttribute("aria-label", lang === "en" ? "한국어로 전환" : "Switch to English");
          panels.forEach((p) => p.translate());
          $("tooltip").hidden = true;
        });
        document.addEventListener("visibilitychange", () => {
          if (document.hidden)
            panels.forEach((p) => {
              if (p.experiment.running) {
                if (p.remote) p.remote.pause();
                else p.experiment.pause();
                p.render();
              } else if (p.experiment.replaying) {
                p.experiment.replaying = false;
                p.render();
              }
            });
        });
        // A shared frame budget keeps controls responsive; state and training remain panel-local.
        let first = 0;
        function frame(now) {
          const start = performance.now();
          for (let offset = 0; offset < panels.length; offset++) {
            const panel = panels[(first + offset) % panels.length],
              e = panel.experiment;
            if (e.running && !panel.remote) {
              const previous = e.history.length;
              for (let j = 0; j < Number(panel.control("speed").value) && e.running; j++) {
                if (performance.now() - start > 12) break;
                e.trainOne();
              }
              if (e.history.length !== previous || !e.running) panel.render();
            } else if (e.replaying && now - panel.lastReplay >= 100) {
              e.replayTick();
              panel.lastReplay = now;
              panel.render();
            }
          }
          first = (first + 1) % panels.length;
          panels.forEach((panel) => {
            if (panel.dirty) panel.draw();
            panel.landscape.tick(now);
            if (panel.landscape.dirty) panel.landscape.draw();
          });
          requestAnimationFrame(frame);
        }
        requestAnimationFrame(frame);
      })();
    </script>
  </body>
</html>
