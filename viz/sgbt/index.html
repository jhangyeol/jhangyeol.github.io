<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Streaming Gradient Boosted Trees(SGBT)가 drift가 있는 스트림에서 트리를 키우고 교체하는 과정을 시각화." />
    <title>SGBT Stream Visualizer</title>
    <style>
      :root {
        --bg: #f4f4f1;
        --card: #ffffff;
        --ink: #1c1e23;
        --muted: #6b6f78;
        --faint: #a3a6ad;
        --line: rgba(20, 24, 32, 0.1);
        --line2: rgba(20, 24, 32, 0.18);
        --accent: #2f6fdf;
        --neg: #2f6fdf;
        --pos: #e5772f;
        --f1: #109a8e;
        --f2: #8a5cf0;
        --warn: #d99a0b;
        --drift: #d6443b;
        --ok: #2e9d57;
        --shadow: 0 1px 2px rgba(0, 0, 0, 0.04), 0 4px 16px rgba(0, 0, 0, 0.04);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #0f1115;
          --card: #171a20;
          --ink: #e8e9ec;
          --muted: #9a9fa9;
          --faint: #626772;
          --line: rgba(255, 255, 255, 0.08);
          --line2: rgba(255, 255, 255, 0.16);
          --accent: #6b9cf5;
          --neg: #5a8ff0;
          --pos: #f08c45;
          --f1: #2cc0b2;
          --f2: #a585f7;
          --warn: #f0b429;
          --drift: #f0625a;
          --ok: #46c27a;
          --shadow: none;
        }
      }
      :root[data-theme="dark"] {
        --bg: #0f1115;
        --card: #171a20;
        --ink: #e8e9ec;
        --muted: #9a9fa9;
        --faint: #626772;
        --line: rgba(255, 255, 255, 0.08);
        --line2: rgba(255, 255, 255, 0.16);
        --accent: #6b9cf5;
        --neg: #5a8ff0;
        --pos: #f08c45;
        --f1: #2cc0b2;
        --f2: #a585f7;
        --warn: #f0b429;
        --drift: #f0625a;
        --ok: #46c27a;
        --shadow: none;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font:
          14px/1.45 -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          "Apple SD Gothic Neo",
          "Noto Sans KR",
          sans-serif;
      }
      button,
      select,
      input {
        font: inherit;
        color: inherit;
      }
      .num {
        font-variant-numeric: tabular-nums;
      }
      .muted {
        color: var(--muted);
      }
      .warnc {
        color: var(--warn);
        font-weight: 600;
      }
      .driftc {
        color: var(--drift);
        font-weight: 600;
      }

      /* ---------- header ---------- */
      header {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 12px 20px;
        padding: 14px 20px;
        max-width: 1480px;
        margin: 0 auto;
      }
      .brand {
        display: flex;
        align-items: baseline;
        gap: 8px;
        margin-right: auto;
      }
      .brand h1 {
        font-size: 19px;
        margin: 0;
        letter-spacing: -0.01em;
      }
      .brand h1 span {
        color: var(--muted);
        font-weight: 500;
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
      }
      .seg {
        display: inline-flex;
        background: var(--card);
        border: 1px solid var(--line2);
        border-radius: 9px;
        padding: 2px;
      }
      .seg button {
        border: 0;
        background: none;
        padding: 5px 11px;
        border-radius: 7px;
        cursor: pointer;
        color: var(--muted);
        white-space: nowrap;
      }
      .seg button.on {
        background: var(--ink);
        color: var(--card);
      }
      .ctl {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: var(--muted);
        font-size: 13px;
      }
      select,
      .btn {
        background: var(--card);
        border: 1px solid var(--line2);
        border-radius: 8px;
        padding: 5px 9px;
        cursor: pointer;
      }
      .btn:hover,
      select:hover {
        border-color: var(--faint);
      }
      .info {
        display: inline-grid;
        place-items: center;
        width: 17px;
        height: 17px;
        border-radius: 50%;
        border: 1px solid var(--line2);
        background: none;
        color: var(--muted);
        font:
          italic 600 11px/1 Georgia,
          serif;
        cursor: pointer;
        padding: 0;
        flex: none;
        vertical-align: middle;
      }
      .info:hover {
        color: var(--ink);
        border-color: var(--ink);
      }

      /* ---------- layout ---------- */
      main {
        display: grid;
        grid-template-columns: minmax(300px, 560px) minmax(320px, 1fr);
        gap: 14px;
        padding: 0 20px 24px;
        max-width: 1480px;
        margin: 0 auto;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
        box-shadow: var(--shadow);
        padding: 12px 14px 14px;
        min-width: 0;
      }
      .card-head {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 10px;
      }
      .card-head h2 {
        font-size: 14px;
        margin: 0;
        font-weight: 650;
      }
      .card-head .sp {
        flex: 1;
      }
      .timeline {
        grid-column: 1 / -1;
      }
      @media (max-width: 920px) {
        main {
          grid-template-columns: minmax(0, 1fr);
          padding: 0 12px 20px;
        }
        header {
          padding: 12px;
        }
      }

      /* ---------- plot ---------- */
      .plot-wrap {
        position: relative;
        width: 100%;
        aspect-ratio: 1;
      }
      #plot {
        width: 100%;
        height: 100%;
        display: block;
        border-radius: 8px;
        cursor: crosshair;
      }
      .toggles {
        display: inline-flex;
        gap: 4px;
        flex-wrap: wrap;
      }
      .chip {
        border: 1px solid var(--line2);
        border-radius: 999px;
        padding: 2px 9px;
        font-size: 12px;
        background: none;
        cursor: pointer;
        color: var(--muted);
      }
      .chip.on {
        color: var(--ink);
        border-color: var(--ink);
      }
      .concept {
        font-size: 12px;
        padding: 2px 8px;
        border-radius: 999px;
        background: var(--bg);
        color: var(--muted);
        transition: background 0.3s;
      }
      .concept.flash {
        background: var(--drift);
        color: #fff;
      }
      .legend {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        color: var(--muted);
        margin-top: 8px;
      }
      .legend .grad {
        flex: 1;
        max-width: 220px;
        height: 8px;
        border-radius: 4px;
      }
      .legend .key {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        margin-left: 10px;
      }
      .legend .key i {
        display: inline-block;
        width: 16px;
        border-top: 2px solid var(--ink);
      }
      .legend .key i.dash {
        border-top-style: dashed;
        border-color: var(--muted);
      }
      #tip {
        position: absolute;
        pointer-events: none;
        background: var(--card);
        border: 1px solid var(--line2);
        border-radius: 8px;
        padding: 5px 8px;
        font-size: 12px;
        white-space: nowrap;
        display: none;
        box-shadow: var(--shadow);
        z-index: 3;
      }

      /* ---------- ensemble cards ---------- */
      .trees {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(124px, 1fr));
        gap: 8px;
      }
      .slot {
        position: relative;
        min-height: 128px;
      }
      .tcard {
        position: relative;
        border: 1px solid var(--line2);
        border-radius: 10px;
        padding: 6px 7px 7px;
        cursor: pointer;
        background: var(--card);
        transition:
          border-color 0.2s,
          box-shadow 0.2s;
      }
      .tcard:hover {
        border-color: var(--faint);
      }
      .slot.sel .tcard {
        border-color: var(--accent);
        box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 30%, transparent);
      }
      .slot.warn .tcard {
        border-color: var(--warn);
      }
      .tc-top {
        display: flex;
        align-items: baseline;
        gap: 5px;
        font-size: 12px;
      }
      .tc-top .k {
        color: var(--muted);
      }
      .tc-top b {
        font-weight: 650;
      }
      .tc-top .badge {
        margin-left: auto;
        font-size: 10px;
        padding: 0 5px;
        border-radius: 4px;
        background: var(--ok);
        color: #fff;
        display: none;
      }
      .slot.fresh .tc-top .badge {
        display: inline-block;
      }
      .mini {
        width: 100%;
        height: 58px;
        display: block;
        margin: 3px 0 2px;
      }
      .tc-meta {
        display: flex;
        justify-content: space-between;
        font-size: 11px;
        color: var(--muted);
      }
      .meter {
        position: relative;
        height: 5px;
        border-radius: 3px;
        background: var(--line);
        margin-top: 5px;
        overflow: visible;
      }
      .meter .fill {
        position: absolute;
        inset: 0 auto 0 0;
        border-radius: 3px;
        background: var(--ok);
      }
      .meter .tick {
        position: absolute;
        top: -2px;
        bottom: -2px;
        width: 2px;
        border-radius: 1px;
      }
      .meter.cold {
        opacity: 0.35;
      }
      .alt {
        display: none;
        align-items: center;
        gap: 6px;
        margin-top: 4px;
        padding: 3px 6px;
        font-size: 11px;
        border: 1px dashed var(--warn);
        border-radius: 7px;
        color: var(--warn);
        cursor: pointer;
      }
      .slot.warn .alt {
        display: flex;
      }
      .alt canvas {
        width: 44px;
        height: 18px;
      }
      .ghost {
        position: absolute;
        inset: 0 0 auto 0;
        pointer-events: none;
        animation: out 0.9s ease-in forwards;
        border-color: var(--drift) !important;
        z-index: 2;
      }
      @keyframes out {
        0% {
          transform: none;
          opacity: 1;
        }
        30% {
          transform: translateY(-4px) rotate(-1deg);
          opacity: 1;
        }
        100% {
          transform: translateY(-46px) rotate(-6deg) scale(0.85);
          opacity: 0;
        }
      }
      .tcard.enter {
        animation: enter 0.9s ease-out;
      }
      @keyframes enter {
        0% {
          transform: translateY(26px);
          opacity: 0;
          box-shadow: 0 0 0 0 var(--ok);
        }
        55% {
          transform: none;
          opacity: 1;
          box-shadow: 0 0 0 4px color-mix(in srgb, var(--ok) 45%, transparent);
        }
        100% {
          box-shadow: 0 0 0 0 transparent;
        }
      }
      .sub {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 14px 0 6px;
      }
      .sub h3 {
        margin: 0;
        font-size: 13px;
        font-weight: 650;
      }
      #log {
        list-style: none;
        margin: 0;
        padding: 0;
        max-height: 172px;
        overflow: auto;
        font-size: 12px;
      }
      #log li {
        display: grid;
        grid-template-columns: 64px 34px 1fr auto;
        gap: 6px;
        padding: 4px 6px;
        border-radius: 6px;
        cursor: pointer;
        align-items: center;
      }
      #log li:hover {
        background: var(--bg);
      }
      #log .t {
        color: var(--muted);
      }
      #log .arrow {
        color: var(--drift);
      }
      #log .tag {
        font-size: 10px;
        color: var(--warn);
        border: 1px solid var(--warn);
        border-radius: 4px;
        padding: 0 4px;
      }
      #log .empty {
        display: block;
        color: var(--faint);
        cursor: default;
      }

      /* ---------- timeline ---------- */
      .stats {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 22px;
        font-size: 12px;
        color: var(--muted);
      }
      @media (max-width: 600px) {
        .stats {
          gap: 4px 14px;
        }
        .stats b {
          font-size: 15px;
        }
      }
      .stats b {
        display: block;
        font-size: 18px;
        color: var(--ink);
        font-weight: 650;
      }
      .stats .base b {
        color: var(--muted);
      }
      #timeline {
        width: 100%;
        display: block;
        cursor: pointer;
        touch-action: none;
        margin-top: 8px;
      }
      .transport {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-top: 8px;
        flex-wrap: wrap;
      }
      .transport .btn {
        width: 34px;
        height: 30px;
        padding: 0;
        display: inline-grid;
        place-items: center;
      }
      .transport .btn.play {
        width: 44px;
        background: var(--ink);
        color: var(--card);
        border-color: var(--ink);
      }
      .transport svg {
        width: 14px;
        height: 14px;
        fill: currentColor;
      }
      #scrub {
        flex: 1;
        min-width: 140px;
        accent-color: var(--accent);
      }
      #tlabel {
        min-width: 110px;
        text-align: right;
        font-size: 12px;
        color: var(--muted);
      }

      /* ---------- popover & params ---------- */
      .pop {
        position: fixed;
        z-index: 50;
        max-width: 320px;
        background: var(--card);
        border: 1px solid var(--line2);
        border-radius: 12px;
        padding: 10px 13px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.18);
        font-size: 13px;
        display: none;
      }
      .pop h4 {
        margin: 0 0 4px;
        font-size: 13px;
      }
      .pop ul {
        margin: 6px 0 2px;
        padding-left: 18px;
      }
      .pop li {
        margin: 2px 0;
      }
      #params {
        position: fixed;
        z-index: 40;
        width: 300px;
        max-width: calc(100vw - 24px);
        max-height: calc(100vh - 80px);
        overflow: auto;
        background: var(--card);
        border: 1px solid var(--line2);
        border-radius: 14px;
        padding: 12px 14px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.18);
        display: none;
      }
      #params.open {
        display: block;
      }
      .prow {
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: center;
        gap: 2px 8px;
        margin: 8px 0;
        font-size: 13px;
      }
      .prow label {
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .prow output {
        font-size: 12px;
        color: var(--muted);
      }
      .prow input[type="range"] {
        grid-column: 1 / -1;
        width: 100%;
        accent-color: var(--accent);
      }
      .phead {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 4px;
      }
      .phead h3 {
        margin: 0;
        font-size: 14px;
      }

      /* ---------- drawer ---------- */
      #drawer {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        width: 460px;
        max-width: 100vw;
        background: var(--card);
        border-left: 1px solid var(--line2);
        box-shadow: -10px 0 30px rgba(0, 0, 0, 0.12);
        transform: translateX(105%);
        transition: transform 0.25s ease;
        z-index: 30;
        display: flex;
        flex-direction: column;
      }
      #drawer.open {
        transform: none;
      }
      .dhead {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 14px 16px 10px;
        border-bottom: 1px solid var(--line);
      }
      .dhead h2 {
        margin: 0;
        font-size: 16px;
      }
      .pill {
        font-size: 11px;
        padding: 1px 8px;
        border-radius: 999px;
        color: #fff;
        background: var(--ok);
      }
      .pill.warn,
      .pill.bg {
        background: var(--warn);
      }
      .pill.retired {
        background: var(--drift);
      }
      .pill.unborn {
        background: var(--faint);
      }
      .dbody {
        overflow: auto;
        padding: 12px 16px 24px;
        flex: 1;
      }
      .dbody .lead {
        color: var(--muted);
        font-size: 13px;
        margin: 0 0 10px;
      }
      .kv {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        margin-bottom: 12px;
      }
      .kv div {
        background: var(--bg);
        border-radius: 8px;
        padding: 6px 8px;
        font-size: 11px;
        color: var(--muted);
      }
      .kv b {
        display: block;
        color: var(--ink);
        font-size: 15px;
        font-weight: 650;
      }
      .dsec {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 14px 0 6px;
      }
      .dsec h3 {
        margin: 0;
        font-size: 13px;
      }
      .treebox {
        overflow: auto;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--bg);
        max-height: 46vh;
      }
      .treebox svg {
        display: block;
      }
      .treebox text {
        font-size: 10.5px;
        fill: var(--ink);
        font-variant-numeric: tabular-nums;
      }
      .treebox .lf {
        cursor: pointer;
      }
      .treebox .lf.hl circle {
        stroke: var(--ink);
        stroke-width: 2.5;
      }
      .hist {
        position: relative;
        height: 34px;
        background: var(--bg);
        border-radius: 8px;
      }
      .hist .hseg {
        position: absolute;
        top: 6px;
        height: 22px;
        border-radius: 5px;
        font-size: 10.5px;
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        white-space: nowrap;
        cursor: pointer;
        border: 0;
        padding: 0;
      }
      .hist .now {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 2px;
        background: var(--ink);
      }
      .close {
        margin-left: auto;
        background: none;
        border: 0;
        font-size: 22px;
        line-height: 1;
        cursor: pointer;
        color: var(--muted);
      }
      .bgnote {
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 6px 9px;
        border: 1px dashed var(--warn);
        border-radius: 8px;
        color: var(--warn);
        font-size: 12px;
        margin-bottom: 10px;
        cursor: pointer;
      }
      .empty-tree {
        padding: 18px;
        color: var(--muted);
        font-size: 13px;
        text-align: center;
      }
      @media (max-width: 600px) {
        #drawer {
          top: auto;
          height: 78vh;
          width: 100vw;
          border-left: 0;
          border-top: 1px solid var(--line2);
          border-radius: 16px 16px 0 0;
          transform: translateY(105%);
        }
        .kv {
          grid-template-columns: repeat(2, 1fr);
        }
      }
      /* ---------- v2: stable layout, slices, tree zoom ---------- */
      .slot {
        height: 150px;
        min-height: 0;
      }
      .alt {
        display: flex;
        visibility: hidden;
      }
      .slot.warn .alt {
        visibility: visible;
      }
      #log {
        height: 172px;
        max-height: none;
      }
      .concept {
        white-space: nowrap;
      }
      .dsdesc {
        margin: -4px 0 8px;
        font-size: 12px;
        color: var(--muted);
        line-height: 1.4;
      }
      .axes {
        display: none;
        align-items: center;
        flex-wrap: wrap;
        gap: 6px 12px;
        font-size: 12px;
        margin-bottom: 8px;
      }
      .axes label {
        display: inline-flex;
        gap: 5px;
        align-items: center;
        color: var(--muted);
      }
      .axes select {
        padding: 2px 6px;
        font-size: 12px;
      }
      .status {
        position: absolute;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        background: color-mix(in srgb, var(--card) 80%, transparent);
        color: var(--muted);
        border-radius: 8px;
        font-size: 13px;
      }
      .stats .st {
        min-width: 150px;
      }
      .stats .st.sm {
        min-width: 64px;
      }
      .stats .st span {
        display: block;
        white-space: nowrap;
      }
      .stats .st em {
        display: block;
        font-style: normal;
        font-size: 11px;
        color: var(--faint);
        white-space: nowrap;
      }
      .dbody {
        display: flex;
        flex-direction: column;
      }
      .ovl-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 12px;
      }
      .seg button:disabled {
        opacity: 0.35;
        cursor: default;
      }
      .tree-head {
        margin-top: 4px;
      }
      .tree-head .sp {
        flex: 1;
      }
      .zoom {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-size: 11px;
        color: var(--muted);
      }
      .zoom .btn {
        padding: 1px 8px;
        font-size: 12px;
        line-height: 1.5;
      }
      .zoom span {
        min-width: 36px;
        text-align: center;
      }
      .fchips {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 10px;
        font-size: 11px;
        color: var(--muted);
        margin-bottom: 6px;
        min-height: 16px;
      }
      .fchip {
        display: inline-flex;
        align-items: center;
        gap: 4px;
      }
      .fchip i {
        width: 8px;
        height: 8px;
        border-radius: 2px;
        display: inline-block;
      }
      .treebox {
        position: relative;
        flex: 1 1 auto;
        min-height: 260px;
        max-height: none;
        overflow: hidden;
        cursor: grab;
        touch-action: none;
      }
      .treebox.panning {
        cursor: grabbing;
      }
      .treebox svg {
        position: absolute;
        inset: 0;
      }
      .treebox .empty-tree {
        position: absolute;
        inset: 0;
        display: none;
        padding-top: 40px;
      }
      #dHist {
        flex: none;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="brand">
        <h1>SGBT <span>on drifting streams</span></h1>
        <button class="info" data-info="sgbt" aria-label="SGBT 설명">i</button>
      </div>
      <div class="controls">
        <div class="seg" id="task">
          <button data-v="cls">Classification</button>
          <button data-v="reg">Regression</button>
        </div>
        <label class="ctl"
          >Dataset
          <select id="scenario"></select
          ><button class="info" data-info="dataset" aria-label="Dataset 설명">i</button></label
        >
        <label class="ctl"
          >Drift
          <select id="drift">
            <option value="abrupt">Abrupt</option>
            <option value="gradual">Gradual</option>
            <option value="incremental">Incremental</option>
            <option value="none">None</option>
          </select>
          <button class="info" data-info="drift" aria-label="Drift 설명">i</button>
        </label>
        <button class="btn" id="btnParams">Hyperparameters ▾</button>
      </div>
    </header>

    <main>
      <section class="card">
        <div class="card-head">
          <h2>Feature space</h2>
          <button class="info" data-info="plot">i</button>
          <span class="concept num" id="concept">Concept 1</span>
          <span class="sp"></span>
          <div class="toggles">
            <button class="chip on" data-show="boundary">Boundary</button>
            <button class="chip on" data-show="truth" id="chipTruth">True</button>
            <button class="chip on" data-show="points">Points</button>
          </div>
        </div>
        <p class="dsdesc" id="dsDesc"></p>
        <div class="axes" id="axes"></div>
        <div class="plot-wrap">
          <canvas id="plot"></canvas>
          <div id="tip"></div>
          <div class="status" id="status"></div>
        </div>
        <div class="legend" id="legend"></div>
      </section>

      <section class="card">
        <div class="card-head">
          <h2>Boosting stages <span class="muted" style="font-weight: 400">F(x) = Σ η·f<sub>k</sub>(x)</span></h2>
          <button class="info" data-info="ensemble">i</button>
          <span class="sp"></span>
          <span class="muted" style="font-size: 12px">drift detector <button class="info" data-info="detector">i</button></span>
        </div>
        <div class="trees" id="trees"></div>
        <div class="sub">
          <h3>Swap log</h3>
          <button class="info" data-info="swap">i</button>
          <span class="muted num" id="swapCount" style="font-size: 12px"></span>
        </div>
        <ol id="log"></ol>
      </section>

      <section class="card timeline">
        <div class="card-head">
          <h2>Timeline</h2>
          <button class="info" data-info="timeline">i</button>
          <span class="sp"></span>
          <div class="stats num" id="stats"></div>
        </div>
        <canvas id="timeline"></canvas>
        <div class="transport">
          <button class="btn" id="bStart" title="처음으로">
            <svg viewBox="0 0 16 16"><path d="M3 2h2v12H3zM14 2v12L6 8z" /></svg>
          </button>
          <button class="btn" id="bBack" title="한 프레임 뒤로 (←)">
            <svg viewBox="0 0 16 16"><path d="M12 2v12L4 8z" /></svg>
          </button>
          <button class="btn play" id="bPlay" title="재생/일시정지 (Space)"></button>
          <button class="btn" id="bFwd" title="한 프레임 앞으로 (→)">
            <svg viewBox="0 0 16 16"><path d="M4 2v12l8-6z" /></svg>
          </button>
          <select id="speed" title="재생 속도">
            <option value="0.25">0.25×</option>
            <option value="0.5">0.5×</option>
            <option value="1" selected>1×</option>
            <option value="2">2×</option>
            <option value="4">4×</option>
          </select>
          <input type="range" id="scrub" min="0" max="1" value="0" step="1" aria-label="시간" />
          <span id="tlabel" class="num"></span>
        </div>
      </section>
    </main>

    <div id="params">
      <div class="phead">
        <h3>Hyperparameters</h3>
        <button class="btn" id="reseed" title="같은 설정, 새 스트림">New seed</button>
      </div>
      <div id="prows"></div>
    </div>

    <aside id="drawer" aria-label="Tree detail">
      <div class="dhead">
        <h2 id="dTitle"></h2>
        <span class="pill" id="dPill"></span>
        <button class="info" data-info="tree">i</button>
        <button class="close" id="dClose" aria-label="닫기">×</button>
      </div>
      <div class="dbody" id="dBody">
        <div id="dInfo"></div>
        <div class="dsec tree-head">
          <h3>Structure</h3>
          <span class="sp"></span>
          <div class="zoom">
            <button class="btn" id="tOut" title="축소">−</button>
            <span class="num" id="tZoom">100%</span>
            <button class="btn" id="tIn" title="확대">+</button>
            <button class="btn" id="tFit" title="화면에 맞춤 (더블클릭)">Fit</button>
          </div>
        </div>
        <div class="fchips" id="dFeat"></div>
        <div class="treebox" id="tbox">
          <svg id="tsvg" width="100%" height="100%"><g id="tg"></g></svg>
          <div class="empty-tree" id="tEmpty">시간을 앞으로 이동하면 나타납니다.</div>
        </div>
        <div id="dHist"></div>
      </div>
    </aside>

    <div class="pop" id="pop"></div>

    <script type="module">
      import { start } from "./main.js";
      start();
    </script>
  </body>
</html>
